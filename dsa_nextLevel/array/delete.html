    <label for="">Insert posistion For delete</label>
    <input type="text" id="position" />
    <button onclick="Delete()">Submit</button>

    <script>
      let arr = [34, 65, 23, 56, 76, 98, 24];

      const Delete = () => {
        let position = Number(document.getElementById("position").value);

        for (let i = position; i < arr.length - 1; i++) {
          arr[i] = arr[i + 1];
        }
        console.log(arr);
      };
